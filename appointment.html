  <div class="patient-portal">
    <div class="container">
      <p><a href="portal.html" class="back-link">← Back to Dashboard</a></p>
      <h1>Book an Appointment</h1>

      <div class="section">

        <form class="appointment-form">
          <div class="form-group">
            <label for="doctor">Select Doctor</label>
            <select id="doctor" name="doctor" required>
              <option value="">-- Choose Doctor --</option>
              <option>Dr. Aisha Rahman (Cardiology)</option>
              <option>Dr. Omar Khalid (Dermatology)</option>
              <option>Dr. Sara Al-Mansoori (Pediatrics)</option>
              <option>Dr. Rami Haddad (Orthopedics)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="date">Select Date</label>
            <input type="date" id="date" name="date" required>
          </div>

          <div class="form-group">
            <label for="time">Select Time</label>
            <input type="time" id="time" name="time" required>
          </div>

          <div class="form-group">
            <label for="reason">Reason for Visit</label>
            <textarea id="reason" name="reason" rows="3" placeholder="e.g., annual checkup, follow-up, etc." required></textarea>
          </div>

          <button type="submit" class="btn-primary">Confirm Appointment</button>
        </form>
      </div>
    </div>
  </div>
