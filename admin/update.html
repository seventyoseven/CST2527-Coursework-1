<!-- update patient-->
  <div class="container">
    <h1>Update Patient</h1>
    <p class="subtitle">Select a field to update and enter the new information.</p>

    <form class="patient-form" id="updateForm">
      <div class="form-row">
        <label>NHS Number</label>
        <input type="text" placeholder="Enter patient's NHS number" required />
      </div>

      <div class="form-row">
        <label>Field to Update</label>
        <select id="fieldSelect">
          <option value="">-- Select Field --</option>
          <option value="firstName">First Name</option>
          <option value="lastName">Last Name</option>
          <option value="address">Address</option>
          <option value="dob">Date of Birth</option>
          <option value="telephone">Telephone</option>
        </select>
      </div>

      <div class="form-row" id="updateFieldRow" style="display: none;">
        <label id="updateLabel">Enter Updated Information</label>
        <input type="text" id="updateInput" placeholder="Enter updated info" />
      </div>

      <button type="button" class="btn">Update Patient</button>
    </form>

    <a href="portal.html" class="back-link">← Back to Main Menu</a>
  </div>

<!-- for dropdown menu-->
  <script>
    const fieldSelect = document.getElementById('fieldSelect');
    const updateFieldRow = document.getElementById('updateFieldRow');
    const updateLabel = document.getElementById('updateLabel');
    const updateInput = document.getElementById('updateInput');

    fieldSelect.addEventListener('change', () => {
      const selected = fieldSelect.value;

      if (selected) {
        updateFieldRow.style.display = 'block';

        switch (selected) {
          case 'dob':
            updateInput.type = 'date';
            updateLabel.textContent = 'Enter New Date of Birth';
            updateInput.placeholder = '';
            break;
          case 'telephone':
            updateInput.type = 'tel';
            updateLabel.textContent = 'Enter New Telephone Number';
            updateInput.placeholder = 'Enter new phone number';
            break;
          case 'address':
            updateInput.type = 'text';
            updateLabel.textContent = 'Enter New Address';
            updateInput.placeholder = 'Enter new address';
            break;
          case 'firstName':
            updateInput.type = 'text';
            updateLabel.textContent = 'Enter New First Name';
            updateInput.placeholder = 'Enter new first name';
            break;
          case 'lastName':
            updateInput.type = 'text';
            updateLabel.textContent = 'Enter New Last Name';
            updateInput.placeholder = 'Enter new last name';
            break;
          default:
            updateInput.type = 'text';
            updateLabel.textContent = 'Enter Updated Information';
            updateInput.placeholder = 'Enter updated info';
        }
      } else {
        updateFieldRow.style.display = 'none';
      }
    });
  </script>
