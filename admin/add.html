<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Patient | Medicare</title>
  <link rel="stylesheet" href="../main/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="../js/dbmanager.js"></script>
</head>
<body>

<!-- NAV BAR -->
<nav class="navbar">
  <div class="nav-left">
    <a href="../main/index.html" class="logo-text">MediCare</a>
    <select class="location-select">
      <option selected>Select Location</option>
      <option>Location 1</option>
      <option>Location 2</option>
      <option>Location 3</option>
    </select>
  </div>

  <ul class="nav-right">
    <li><a href="../patient/login.html">Book Appointment</a></li>
    <li><a href="#about">About Us</a></li>
    <li><a href="../main/contact.html">Contact Us</a></li>

    <!-- LOGIN DROPDOWN -->
    <li class="nav-item dropdown">
      <a href="#" class="login-btn">
        <span id="userNameDisplay">Admin</span> <i class="fa fa-caret-down"></i>
      </a>
      <div class="dropdown-menu">
	    <a href="#" onclick="goPortal()">Portal</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </li>
  </ul>
</nav>

<!-- add patient-->
  <div class="container">
    <h1>Add New Patient</h1>
    <p class="subtitle">Enter patient details below.</p>

    <div id="statusMessage" style="margin-bottom: 15px; display: none; padding: 10px; border-radius: 5px;"></div>

    <form class="patient-form" id="addPatientForm">
      <div class="form-row">
        <label>Title</label>
        <select id="title" required>
          <option value="">-- Select Title --</option>
          <option value="Mr">Mr</option>
          <option value="Mrs">Mrs</option>
          <option value="Ms">Ms</option>
          <option value="Miss">Miss</option>
          <option value="Dr">Dr</option>
          <option value="Rev">Rev</option>
        </select>
      </div>

      <div class="form-row two-column">
        <div class="column">
          <label>First Name</label>
          <input type="text" id="firstName" placeholder="Enter first name" required />
        </div>
        <div class="column">
          <label>Last Name</label>
          <input type="text" id="lastName" placeholder="Enter last name" required />
        </div>
      </div>

      <div class="form-row">
        <label>Date of Birth</label>
        <input type="date" id="dob" required />
      </div>

      <div class="form-row">
        <label>Gender</label>
        <select id="gender" required>
          <option value="">-- Select Gender --</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-row">
        <label>NHS Number</label>
        <input type="text" id="nhs" placeholder="Enter NHS number (10 digits)" maxlength="10" required />
      </div>

      <div class="form-row">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email address" required />
      </div>

      <div class="form-row">
        <label>Telephone</label>
        <input type="tel" id="telephone" placeholder="Enter phone number" required />
      </div>

      <div class="form-row">
        <label>Address</label>
        <input type="text" id="address" placeholder="Enter full address" required />
      </div>

      <button type="submit" class="btn">Add Patient</button>
    </form>

    <a href="portal.html" class="back-link">← Back to Main Menu</a>
  </div>
  
  <!-- FOOTER -->
<footer style="margin-top:50px;">
    <div class="footer-left">
        <p><strong>Medicare</strong></p>
        <br>
        <p>123 Med City, MC 45678, United Arab Emirates</p>
    </div>
    <div class="footer-right">
        <div class="social-icons">
            <img src="../images/insta.png" alt="Instagram" width="70" height="70">
            <img src="../images/facebook.png" alt="Facebook" width="70" height="70">
            <img src="../images/youtube.png" alt="Youtube" width="70" height="70">
            <img src="../images/twitter.png" alt="Twitter" width="70" height="70">
            <img src="../images/linkedin.png" alt="Linkedin" width="70" height="70">
        </div>
    </div>
    <div class="copyright">
        <p>&copy; Copyright Medicare 2025</p>
    </div>
</footer>

<script>
//auth check
function checkAuth() {
    const session = hospitalDB.getSession();

    if (!session.userId || session.userType !== "Admin") {
        window.location.replace("login.html");
        return false;
    }

    document.getElementById("userNameDisplay").textContent =
        session.userName?.split(" ")[0] || "Admin";

    return true;
}

//logout
function logout() {
    hospitalDB.clearSession();
    window.location.replace("login.html");
}

//dropdown update
function goPortal() {
    const type = sessionStorage.getItem('userType');

    if (type === 'Patient') window.location.href = '../patient/portal.html';
    if (type === 'Doctor') window.location.href = '../doctor/portal.html';
    if (type === 'Admin') window.location.href = '../admin/portal.html';
}

//handle add patient
async function handleAddPatient(event) {
    event.preventDefault();

    const statusMsg = document.getElementById('statusMessage');
    statusMsg.style.display = 'none';

    try {
        if (!hospitalDB.db) {
            await hospitalDB.init();
        }

        //get form data
        const title = document.getElementById('title').value;
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const dob = document.getElementById('dob').value;
        const gender = document.getElementById('gender').value;
        const nhs = document.getElementById('nhs').value.trim();
        const email = document.getElementById('email').value.trim();
        const telephone = document.getElementById('telephone').value.trim();
        const address = document.getElementById('address').value.trim();

        //validate NHS number
        if (nhs.length !== 10 || !/^\d+$/.test(nhs)) {
            statusMsg.textContent = 'NHS number must be exactly 10 digits';
            statusMsg.style.backgroundColor = '#fee';
            statusMsg.style.color = 'red';
            statusMsg.style.display = 'block';
            return;
        }

        //check if NHS already exists
        const existingPatient = await hospitalDB.getDataByIndex('patients', 'NHS', nhs);
        if (existingPatient) {
            statusMsg.textContent = 'A patient with this NHS number already exists';
            statusMsg.style.backgroundColor = '#fee';
            statusMsg.style.color = 'red';
            statusMsg.style.display = 'block';
            return;
        }

        //check if email already exists
        const existingEmail = await hospitalDB.getDataByIndex('patients', 'Email', email);
        if (existingEmail) {
            statusMsg.textContent = 'A patient with this email already exists';
            statusMsg.style.backgroundColor = '#fee';
            statusMsg.style.color = 'red';
            statusMsg.style.display = 'block';
            return;
        }

        //generate password for new patient
        const password = hospitalDB.generateSecurePassword();
        const encryptedPassword = hospitalDB.encryptData(password);

        //format DOB
        const dobFormatted = new Date(dob).toLocaleDateString('en-GB', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        }).replace(/\//g, '/');

        //create patient object
        const newPatient = {
            Title: title,
            First: firstName,
            Last: lastName,
            DOB: dobFormatted,
            Gender: gender,
            NHS: nhs,
            Email: email,
            Telephone: telephone,
            Address: address,
            Password: encryptedPassword,
            PlainPassword: password
        };

        //add to database
        await hospitalDB.addData('patients', newPatient);

        //success message
        statusMsg.innerHTML = `
            <strong>Patient added successfully!</strong><br>
            <span style="font-size: 0.9rem;">
                Patient: ${firstName} ${lastName}<br>
                Email: ${email}<br>
                <strong>Temporary Password:</strong> ${password}<br>
                <em>(Please inform the patient to change this password)</em>
            </span>
        `;
        statusMsg.style.backgroundColor = '#d4edda';
        statusMsg.style.color = '#155724';
        statusMsg.style.display = 'block';

        //reset form
        document.getElementById('addPatientForm').reset();

        //scroll to top to see message
        window.scrollTo(0, 0);

    } catch (error) {
        console.error('Error adding patient:', error);
        statusMsg.textContent = 'An error occurred. Please try again.';
        statusMsg.style.backgroundColor = '#fee';
        statusMsg.style.color = 'red';
        statusMsg.style.display = 'block';
    }
}

//attach form listener
document.getElementById('addPatientForm').addEventListener('submit', handleAddPatient);

//db check
window.onload = async function() {
    if (!hospitalDB.db) {
        await hospitalDB.init();
    }

    checkAuth();
};
</script>

</body>
</html>
