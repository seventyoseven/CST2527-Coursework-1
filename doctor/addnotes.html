<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medical Notes | Medicare</title>
    <link rel="stylesheet" href="../main/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="../js/dbmanager.js"></script>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }

        .container h1 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .back-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .patient-info-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .patient-info-card h2 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
        }

        .patient-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .patient-info-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .patient-info-item i {
            font-size: 1.2rem;
        }

        .notes-form-container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section h3 {
            color: #667eea;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .form-group label .required {
            color: #e74c3c;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Segoe UI', sans-serif;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input[readonly] {
            background-color: #f8f9fa;
            color: #6c757d;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #f0f0f0;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        footer {
            background: #120D0A;
            color: #FFFFF0;
            padding: 3rem 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 100%;
            margin-top: auto;
        }

        .social-icons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .social-icons img {
            width: 40px;
            height: 40px;
        }

        .copyright {
            grid-column: 1 / -1;
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid #444;
        }
    </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <a href="../main/index.html" class="logo-container">
      <img src="../images/logo.png" alt="MediCare Logo" class="logo-image">
      <span class="logo-text">MediCare</span>
    </a>
    <select class="location-select">
      <option selected>Select Location</option>
      <option>Location 1</option>
      <option>Location 2</option>
      <option>Location 3</option>
    </select>
  </div>

  
  <ul class="nav-right">
    <li><a href="portal.html"><i class="fa fa-home"></i> Dashboard</a></li>
    <li><a href="../main/index.html#about">About Us</a></li>
    <li><a href="../main/contact.html">Contact Us</a></li>

    <li class="nav-item dropdown">
      <a href="#" class="login-btn">
        <span id="userNameDisplay">Login</span> <i class="fa fa-caret-down"></i>
      </a>
      <div class="dropdown-menu">
        <a href="profile.html"><i class="fa fa-user"></i> My Profile</a>
        <a href="#" onclick="logout()"><i class="fa fa-sign-out"></i> Logout</a>
      </div>
    </li>
  </ul>
</nav>

<div class="container">
    <h1>Add Medical Notes</h1>
    <p><a href="appointments.html" class="back-link">← Back to Appointments</a></p>

    <div class="patient-info-card" id="patientInfoCard">
        <h2><i class="fa fa-user-circle"></i> Patient Information</h2>
        <div class="patient-info-grid" id="patientInfoGrid">
            <p>Loading patient information...</p>
        </div>
    </div>

    <div class="notes-form-container">
        <form id="medicalNotesForm">
            <div class="form-section">
                <h3><i class="fa fa-stethoscope"></i> Clinical Assessment</h3>
                
                <div class="form-group">
                    <label>Reason for Visit <span class="required">*</span></label>
                    <textarea id="chiefComplaint" required placeholder="Primary reason patient sought medical attention"></textarea>
                </div>

                <div class="form-group">
                    <label>Diagnosis <span class="required">*</span></label>
                    <input type="text" id="diagnosis" required placeholder="Primary diagnosis">
                </div>

                <div class="form-group">
                    <label>Clinical Assessment <span class="required">*</span></label>
                    <textarea id="assessment" required placeholder="Detailed clinical assessment, examination findings, vital signs, etc."></textarea>
                </div>
            </div>

            <div class="form-section">
                <h3><i class="fa fa-heartbeat"></i> Treatment Plan</h3>
                
                <div class="form-group">
                    <label>Treatment Provided <span class="required">*</span></label>
                    <textarea id="treatment" required placeholder="Treatment plan, procedures performed, etc."></textarea>
                </div>

                <div class="form-group">
                    <label>Additional Notes</label>
                    <textarea id="additionalNotes" placeholder="Any additional observations, follow-up instructions, patient education provided"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="window.location.href='appointments.html'">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fa fa-save"></i> Save Medical Notes
                </button>
            </div>
        </form>
    </div>
</div>

<footer>
    <div class="footer-left">
        <p><strong>Medicare</strong></p>
        <br>
        <p>123 Med City, MC 45678, United Arab Emirates</p>
    </div>
    <div class="footer-right">
        <div class="social-icons">
            <img src="../images/insta.png" alt="Instagram" width="70" height="70">
            <img src="../images/facebook.png" alt="Facebook" width="70" height="70">
            <img src="../images/youtube.png" alt="Youtube" width="70" height="70">
            <img src="../images/twitter.png" alt="Twitter" width="70" height="70">
            <img src="../images/linkedin.png" alt="Linkedin" width="70" height="70">
        </div>
    </div>
    <div class="copyright">
        <p>&copy; Copyright Medicare 2025</p>
    </div>
</footer>

<script>
//COPY PASTE THIS FROM HERE//
//san input
function sanitizeInput(input) {
    var sanitized = input
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#x27;")
        .replace(/\//g, "&#x2F;");
    return sanitized;
}
//COPY PASTE TO HERE//

let appointmentId = null;
let appointmentData = null;
let patientData = null;

function checkAuth() {
    const session = hospitalDB.getSession();
    if (!session.userId || session.userType !== 'Doctor') {
        window.location.replace('login.html');
        return null;
    }

    const firstName = session.userName?.split(' ')[0] || 'Doctor';
    document.getElementById('userNameDisplay').textContent = firstName;
    return session;
}

function getAppointmentId() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('appointment');
}

async function loadAppointmentData() {
    appointmentId = getAppointmentId();
    
    if (!appointmentId) {
        alert('No appointment specified');
        window.location.href = 'appointments.html';
        return;
    }

    try {
        appointmentData = await hospitalDB.getDataById('appointments', parseInt(appointmentId));
        
        if (!appointmentData) {
            alert('Appointment not found');
            window.location.href = 'appointments.html';
            return;
        }

        patientData = await hospitalDB.getDataById('patients', appointmentData.Patient_ID);

        if (!patientData) {
            alert('Patient not found');
            window.location.href = 'appointments.html';
            return;
        }

        displayPatientInfo();

    } catch (error) {
        console.error('Error loading appointment data:', error);
        alert('Error loading appointment data');
    }
}

function displayPatientInfo() {
    const grid = document.getElementById('patientInfoGrid');
    
    const apptDate = new Date(appointmentData.Date);
    const dateFormatted = apptDate.toLocaleString('en-GB', {
        day: '2-digit',
        month: 'long',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    });

    grid.innerHTML = `
        <div class="patient-info-item">
            <i class="fa fa-user"></i>
            <div>
                <strong>Name:</strong><br>
                ${patientData.First} ${patientData.Last}
            </div>
        </div>
        <div class="patient-info-item">
            <i class="fa fa-id-card"></i>
            <div>
                <strong>NHS Number:</strong><br>
                ${patientData.NHS}
            </div>
        </div>
        <div class="patient-info-item">
            <i class="fa fa-calendar"></i>
            <div>
                <strong>Appointment:</strong><br>
                ${dateFormatted}
            </div>
        </div>
        <div class="patient-info-item">
            <i class="fa fa-phone"></i>
            <div>
                <strong>Contact:</strong><br>
                ${patientData.Telephone}
            </div>
        </div>
        ${appointmentData.Reason ? `
        <div class="patient-info-item" style="grid-column: 1 / -1;">
            <i class="fa fa-clipboard"></i>
            <div>
                <strong>Booking Reason:</strong><br>
                ${appointmentData.Reason}
            </div>
        </div>
        ` : ''}
    `;
}

document.getElementById('medicalNotesForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const session = checkAuth();
    if (!session) return;

    try {
        const medicalNote = {
            Patient_ID: patientData.id,
            Doctor_ID: parseInt(session.userId),
            Appointment_ID: parseInt(appointmentId),
            Date: new Date().toISOString(),
            Diagnosis: document.getElementById('diagnosis').value,
            ChiefComplaint: document.getElementById('chiefComplaint').value,
            Assessment: document.getElementById('assessment').value,
            Treatment: document.getElementById('treatment').value,
            AdditionalNotes: document.getElementById('additionalNotes').value,
            doctorName: session.userName
        };

        await hospitalDB.addData('medical_notes', medicalNote);

        appointmentData.Status = 'Completed';
        await hospitalDB.updateData('appointments', appointmentData);

        alert('Medical notes saved successfully!');
        window.location.href = 'appointments.html';

    } catch (error) {
        console.error('Error saving notes:', error);
        alert('Error saving medical notes. Please try again.');
    }
});

function goPortal() {
    const type = sessionStorage.getItem('userType');
    if (type === 'Patient') window.location.href = '../patient/portal.html';
    if (type === 'Doctor') window.location.href = '../doctor/portal.html';
    if (type === 'Admin') window.location.href = '../admin/portal.html';
}

function logout() {
    hospitalDB.clearSession();
    const currentPath = window.location.pathname;
    if (currentPath.includes('/doctor/')) {
        window.location.replace('login.html');
    } else {
        window.location.replace('index.html');
    }
}

window.onload = async function() {
    if (!hospitalDB.db) {
        await hospitalDB.init();
    }
    checkAuth();
    await loadAppointmentData();
};
</script>

</body>
</html>
