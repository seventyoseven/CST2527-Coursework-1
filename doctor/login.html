<script>
// Function to sanitize input by replacing special characters with HTML entities
function sanitizeInput(input) {
    var sanitized = input
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#x27;")
        .replace(/\//g, "&#x2F;");
    return sanitized;
}

//decrypt
function decryptData(encryptedPassword) {
    return hospitalDB.decryptData(encryptedPassword);
}

//login
async function handleLogin(event) {
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMessage');
    const successMsg = document.getElementById('successMessage');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    try {
        //db is ready?
        if (!hospitalDB.db) {
            await hospitalDB.init();
        }

        //authy
        const result = await hospitalDB.authenticateDoctor(email, password);

        if (!result.success) {
			errorMsg.className = "login-error";
            errorMsg.textContent = "Invalid credentials";
            errorMsg.style.display = "block";
            return;
        }

        const user = result.user;

        //save session
        hospitalDB.saveSession(
            user.id,
            "Doctor",
            `${user.first_name} ${user.last_name}`,
            {
                doctorid: user.id,
            }
        );

        setTimeout(() => {
            window.location.href = "portal.html";
        }, 1000);

    } catch (err) {
        console.error(err);
        errorMsg.textContent = 'An error occurred. Please try again.';
        errorMsg.style.display = 'block';
    }
}

//sample creds delete later
async function showCredentials() {
    const display = document.getElementById('credentialsDisplay');

    try {
        if (!hospitalDB.db) {
            await hospitalDB.init();
        }

        const creds = await hospitalDB.getSampleCredentials("Doctor");

        if (creds.length === 0) {
            display.innerHTML = `<p>check f12</p>`;
            display.style.display = "block";
            return;
        }

        let html = '<div style="max-height: 200px; overflow-y: auto;">';

        creds.forEach(cred => {
            html += `
                <div style="margin: 8px 0; padding: 8px; background: white; border-radius: 4px; cursor: pointer;"
                     onclick="fillLoginForm('${cred.email}', '${cred.password}')">
                    <strong>${cred.name}</strong><br>
                    Email: ${cred.email}<br>
                    Password: ${cred.password}
                    <small style="display: block; color: #666; margin-top: 4px;">Click to autofill</small>
                </div>
            `;
        });

        html += '</div>';
        display.innerHTML = html;
        display.style.display = 'block';

    } catch (error) {
        console.error('Error:', error);
        display.innerHTML = '<p>Error loading credentials.</p>';
        display.style.display = 'block';
    }
}

// autofill 4 sample
function fillLoginForm(email, password) {
    document.getElementById("email").value = email;
    document.getElementById("password").value = password;
}

//auto redirect if logged in
window.onload = async function() {
    if (!hospitalDB.db) {
        await hospitalDB.init();
    }

    if (hospitalDB.isAuthenticated()) {
        const session = hospitalDB.getSession();
        if (session.userType === "Doctor") {
            window.location.replace("portal.html");
        }
    }
};

// attach listener
document.getElementById('loginForm').addEventListener('submit', handleLogin);
</script>
