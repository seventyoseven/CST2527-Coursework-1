    <!-- Load doctordatabase.js -->
    <script src="../js/dbmanager.js"></script>
    <script>

    window.onDBReady = function() {
        console.log("DB is ready to populate dropdowns");
        populatePatientNHSDropdown();
        getMedicationData(); 
    };

    function populatePatientNHSDropdown() {
        if (!db) {
            console.error("Patient Object Store not ready yet");
            return;
        }
        
        const transaction = db.transaction("patients","readonly");
        const store = transaction.objectStore("patients");
        const getAllRequest = store.getAll();

        getAllRequest.onsuccess = function(event) {
            const patients = event.target.result;
            const list = document.getElementById("name-list-p");
            list.innerHTML = "";

            if (patients.length === 0) {
                return;
            }

            patients.forEach(patient => {
                const div = document.createElement("div");
                div.textContent = `${patient.NHS}`;
                div.onclick = () => selectedPatient(patient);
                list.appendChild(div);
            });
        };

        getAllRequest.onerror = function(event){
            console.error("Error fetching patients: ", event.target.error);
        };
    }

    function selectedPatient(patient){
        document.getElementById("name-input-p").value = `${patient.NHS}`;
        document.getElementById("name-list-p").style.display = "none";
    }


    // 
    function getMedicationData() {
        const transaction = db.transaction("medicines", "readonly");
        const store = transaction.objectStore("medicines");
        const getAllRequest = store.getAll();

        getAllRequest.onsuccess = function (event) {
            const meds = event.target.result;
            const medName = meds.map(item => item.Drug || item.drugName);
            const medColumn = document.getElementById("medication-column");
            if (medColumn) {
                medColumn.innerHTML = displayMedication(medName);
            } else {
                console.log("Element not found on this page.");
            }
        };

        getAllRequest.onerror = function (event) {
            console.error("Error reading data from Medicine object store", event);
        };
    }

    // Generate checkbox for HTML to display the medication names
    function displayMedication(medName) {
        return medName
            .map(
                (name, index) => `
                <label class="checkbox-label">
                    <input type="checkbox" class="med-checkbox" value="${name}" id="med${index + 1}"><span>${name}</span>
                </label>`
            )
            .join('\n');
    }

    // Inserting data from form into medical notes object store
    function inputMedicalRecord(){
        // Read from the dropdown inputs
        const nhs = document.getElementById("name-input-p") ? document.getElementById("name-input-p").value : "";
        const docname = document.getElementById("doctName").value;
        const speciality = document.getElementById("speciality").value;
        const date = document.getElementById("date").value;
        const reason = document.getElementById("reason").value;
        const assessment = document.getElementById("assessment").value;
        const treatment = document.getElementById("treatment").value;
        const dosage = document.getElementById("dosage").value;
        const notes = document.getElementById("notes").value;

        // to delete when the other validation is fixed
        const meds = Array.from(document.querySelectorAll('.med-checkbox:checked')).map(checkbox => checkbox.value);
        if (!nhs || !docname || !speciality || !date || !reason || !assessment || !treatment || !dosage || !notes) {
        alert("Please fill in all required fields before submitting.");
        return;
        }
        const record = {
            patientNhs: nhs,
            doctorName: docname, 
            doctorSpeciality: speciality,
            appointmentId: Date.now(),
            notesDate: date,
            notesReason: reason,
            notesAssessment: assessment,
            notesTreatment: treatment,
            notesMedication: meds.join(", "),
            notesDosage: dosage,
            notesAdd: notes
        };
        
        const transaction = db.transaction("medical_notes", "readwrite");
        const store = transaction.objectStore("medical_notes");
        const addRequest = store.add(record);

        addRequest.onsuccess = () => {
            alert("Medical Record Saved!");
            document.querySelector('.doctor-form').reset();
            // Clear dropdowns
            document.getElementById("name-input-p").value = "";
        };

        addRequest.onerror = (event) => {
            alert("Error Saving Record: " + event.target.error.message);
        };
    }
    </script>

<script>
    /* ============== */
    function toggleDropdownP(){
        const dropdown = document.getElementById("name-list-p");
        dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
    }

    function filteringInputP(){
        const input = document.getElementById("name-input-p").value.toUpperCase();
        const names = document.querySelectorAll("#name-list-p div");

        names.forEach(name => {
            const text = name.textContent.toUpperCase();
            name.style.display = text.includes(input) ? "" : "none";
        }); 
    }

    function checkAuth() {
    const session = hospitalDB.getSession();

    if (!session.userId || session.userType !== 'Doctor') {
        window.location.replace('login.html');
        return false;
    }

    //add ui in name
    const fullName = session.userName || 'Doctor';
    const firstName = fullName.split(' ')[0];

    document.getElementById('userNameDisplay').textContent = firstName;
    const docNameInput = document.getElementById("doctName");
    if (docNameInput){
        docNameInput.value = fullName;
        docNameInput.readOnly = true;
    }

    return true;
    }

    // To add in todays date on default
    window.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').value = today;
    });

    //dropdown update
    function goPortal() {
        const type = sessionStorage.getItem('userType');

        if (type === 'Patient') window.location.href = '../patient/portal.html';
        if (type === 'Doctor') window.location.href = '../doctor/portal.html';
        if (type === 'Admin') window.location.href = '../admin/portal.html';
    }

    //logout -- clear session
    function logout() {
        hospitalDB.clearSession();
        window.location.replace('login.html');
    }

    //db check
    window.onload = async function() {
        if (!hospitalDB.db) {
            await hospitalDB.init();
        }
        checkAuth();
    };
    /* =============== */
</script>
