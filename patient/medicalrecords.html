<script>
function escapeHTML(text) {
    if (!text) return '';
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

var db;

// Auth check
function checkAuth() {
    var userId = sessionStorage.getItem('userId');
    var userType = sessionStorage.getItem('userType');
    var userName = sessionStorage.getItem('userName');
    var patientId = sessionStorage.getItem('patientId');
    
    if (!userId || userType !== 'Patient') {
        window.location.replace('login.html');
        return null;
    }
    
    if (userName) {
        var firstName = userName.split(' ')[0];
        document.getElementById('userNameDisplay').textContent = firstName;
    }
    
    return patientId;
}

// Logout
function logout() {
    sessionStorage.removeItem('userId');
    sessionStorage.removeItem('userType');
    sessionStorage.removeItem('userName');
    sessionStorage.removeItem('patientId');
    sessionStorage.removeItem('patientNHS');
    window.location.replace('login.html');
}

// Dropdown update
function goPortal() {
    const type = sessionStorage.getItem('userType');
    if (type === 'Patient') window.location.href = '../patient/portal.html';
    if (type === 'Doctor') window.location.href = '../doctor/portal.html';
    if (type === 'Admin') window.location.href = '../admin/portal.html';
}

// Load medical notes - FIXED VERSION
async function loadMedicalNotes() {
    var patientId = checkAuth();
    if (!patientId) return;
    
    if (!db) db = window.db;
    if (!db) {
        console.log('Database not ready, retrying...');
        setTimeout(loadMedicalNotes, 100);
        return;
    }
    
    try {
        // Use getAllData and filter manually instead of index
        var transaction = db.transaction(['medical_notes', 'doctors'], 'readonly');
        var notesStore = transaction.objectStore('medical_notes');
        var allNotesRequest = notesStore.getAll();
        
        allNotesRequest.onsuccess = function(event) {
            var allNotes = event.target.result;
            
            // Filter notes for this patient
            var notes = allNotes.filter(note => 
                note.Patient_ID === parseInt(patientId)
            );
            
            document.getElementById('notesLoading').style.display = 'none';
            
            if (notes.length > 0) {
                // Sort by date (newest first)
                notes.sort((a, b) => new Date(b.Date) - new Date(a.Date));

                var notesList = document.getElementById('notesList');
                notesList.innerHTML = '';

                notes.forEach(note => {
                    createNoteCard(note, notesList, transaction);
                });

                notesList.style.display = 'grid';
            } else {
                document.getElementById('noNotes').style.display = 'block';
            }
        };
        
        allNotesRequest.onerror = function(event) {
            console.error('Error loading notes:', event.target.error);
            document.getElementById('notesLoading').innerHTML = 
                '<p style="color:red;">Error loading medical records. Please try again.</p>';
        };
        
    } catch (error) {
        console.error('Error in loadMedicalNotes:', error);
        document.getElementById('notesLoading').innerHTML = 
            '<p style="color:red;">Error loading medical records. Please try again.</p>';
    }
}

// Create note card
function createNoteCard(note, container, transaction) {
    var card = document.createElement('div');
    card.className = 'record-card';
    
    var doctorStore = transaction.objectStore('doctors');
    var doctorRequest = doctorStore.get(note.Doctor_ID);
    
    doctorRequest.onsuccess = function(e) {
        var doctor = e.target.result;
        var doctorName = doctor ? 'Dr. ' + doctor.first_name + ' ' + doctor.last_name : 
                                  (note.doctorName || 'N/A');

        var dateObj = new Date(note.Date);
        var formattedDate = dateObj.toLocaleDateString('en-GB', {
            day: '2-digit',
            month: 'long',
            year: 'numeric'
        });

        card.innerHTML = `
            <h3>${escapeHTML(note.Diagnosis || note.notesReason || 'Medical Note')}</h3>
            <p><strong>Date:</strong> ${formattedDate}</p>
            <p><strong>Doctor:</strong> ${doctorName}</p>
            ${note.doctorSpeciality ? `<p><strong>Department:</strong> ${escapeHTML(note.doctorSpeciality)}</p>` : ''}
            ${note.notesAssessment ? `<p><strong>Assessment:</strong> ${escapeHTML(note.notesAssessment)}</p>` : ''}
            ${note.notesTreatment ? `<p><strong>Treatment:</strong> ${escapeHTML(note.notesTreatment)}</p>` : ''}
            ${note.Treatment_Notes ? `<p><strong>Notes:</strong> ${escapeHTML(note.Treatment_Notes)}</p>` : ''}
            ${note.notesMedication ? `<p><strong>Medications:</strong> ${escapeHTML(note.notesMedication)}</p>` : ''}
            ${note.notesDosage ? `<p><strong>Dosage:</strong> ${escapeHTML(note.notesDosage)}</p>` : ''}
            ${note.notesAdd ? `<p><strong>Additional Notes:</strong> ${escapeHTML(note.notesAdd)}</p>` : ''}
        `;

        container.appendChild(card);
    };
}

window.onload = function() {
    if (checkAuth()) {
        loadMedicalNotes();
    }
};

window.logout = logout;
</script>
