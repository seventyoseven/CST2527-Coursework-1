  <div class="patient-portal">
    <div class="container">
      <p><a href="portal.html" class="back-link">← Back to Dashboard</a></p>
      <h1>Medical Records</h1>

      <div class="section">
        <div id="notesLoading" style="text-align: center; padding: 20px;">
          <i class="fa fa-spinner fa-spin" style="font-size: 24px;"></i>
          <p>Loading medical records...</p>
        </div>

        <div class="records-list" id="notesList" style="display: none;"></div>
        <p id="noNotes" class="no-data" style="display: none;">No medical records available.</p>
      </div>

  <!-- FOOTER -->
<footer style="margin-top:50px;">
    <div class="footer-left">
        <p><strong>Medicare</strong></p>
        <br>

    </div>
    <div class="footer-right">

            <img src="../images/insta.png" alt="Instagram" width="70" height="70">
            <img src="../images/facebook.png" alt="Facebook" width="70" height="70">

            <img src="../images/twitter.png" alt="Twitter" width="70" height="70">

    </div>

    </div>
</footer>

<script>
//backtick in html breaks, this fixes it? maybe. escape html inside template literals
	function escapeHTML(text) {
		if (!text) return '';
		return text
			.replace(/&/g, "&amp;")
			.replace(/</g, "&lt;")
			.replace(/>/g, "&gt;")
			.replace(/"/g, "&quot;")
			.replace(/'/g, "&#039;");
	}
	
    var db;

	//authy check
    function checkAuth() {
        var userId = sessionStorage.getItem('userId');
        var userType = sessionStorage.getItem('userType');
        var userName = sessionStorage.getItem('userName');
        var patientId = sessionStorage.getItem('patientId');
        
        if (!userId || userType !== 'Patient') {
            window.location.replace('login.html');
            return null;
        }
        
        if (userName) {
            var firstName = userName.split(' ')[0];
            document.getElementById('userNameDisplay').textContent = firstName;
        }
        
        return patientId;
    }

	//logout
    function logout() {
        sessionStorage.removeItem('userId');
        sessionStorage.removeItem('userType');
        sessionStorage.removeItem('userName');
        sessionStorage.removeItem('patientId');
        sessionStorage.removeItem('patientNHS');
        window.location.replace('login.html');
    }

//dropdown update
function goPortal() {
    const type = sessionStorage.getItem('userType');

    if (type === 'Patient') window.location.href = '../patient/portal.html';
    if (type === 'Doctor') window.location.href = '../doctor/portal.html';
    if (type === 'Admin') window.location.href = '../admin/portal.html';
}

	//load medical notes
    function loadMedicalNotes() {
        var patientId = checkAuth();
        if (!patientId) return;
        
        if (!db) db = window.db;
        if (!db) {
            console.log('Database not ready, retrying...');
            setTimeout(loadMedicalNotes, 100);
            return;
        }
        
        var transaction = db.transaction(['medical_notes', 'doctors', 'appointments'], 'readonly');
        var notesStore = transaction.objectStore('medical_notes');
        var notesIndex = notesStore.index('Patient_ID');
        var request = notesIndex.openCursor(parseInt(patientId));
        
        var notes = [];
        
        request.onsuccess = function(event) {
            var cursor = event.target.result;
            
            if (cursor) {
                notes.push(cursor.value);
                cursor.continue();
            } else {
                document.getElementById('notesLoading').style.display = 'none';
                
                if (notes.length > 0) {
                    notes.sort((a, b) => new Date(b.Date) - new Date(a.Date));

                    var notesList = document.getElementById('notesList');
                    notesList.innerHTML = '';

                    notes.forEach(note => {
                        createNoteCard(note, notesList, transaction);
                    });

                    notesList.style.display = 'grid';
                } else {
                    document.getElementById('noNotes').style.display = 'block';
                }
            }
        };
    }

	//styling, mostly. cards for notes
    function createNoteCard(note, container, transaction) {
        var card = document.createElement('div');
        card.className = 'record-card';
        
        var doctorStore = transaction.objectStore('doctors');
        var doctorRequest = doctorStore.get(note.Doctor_ID);
        
        doctorRequest.onsuccess = function(e) {
            var doctor = e.target.result;
            var doctorName = doctor ? 'Dr. ' + doctor.first_name + ' ' + doctor.last_name : 'N/A';

            var appointmentInfo = '';

            if (note.Appointment_ID) {
                var appointmentStore = transaction.objectStore('appointments');
                var appointmentRequest = appointmentStore.get(note.Appointment_ID);
                
                appointmentRequest.onsuccess = function(e2) {
                    if (e2.target.result) {
                        appointmentInfo = '<p><strong>Related to:</strong> Appointment</p>';
                    }
                    renderCard();
                };
            } else {
                renderCard();
            }

			//cards for records
            function renderCard() {
                var dateObj = new Date(note.Date);
                var formattedDate = dateObj.toLocaleDateString('en-GB', {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric'
                });

                card.innerHTML = `
                    <h3>${note.Diagnosis || 'Medical Note'}</h3>
                    <p><strong>Date:</strong> ${formattedDate}</p>
                    <p><strong>Doctor:</strong> ${doctorName}</p>
                    ${appointmentInfo}
					${note.Diagnosis ? `<p><strong>Diagnosis:</strong> ${note.Diagnosis}</p>` : ''}
                    ${note.Treatment_Notes ? `<p><strong>Treatment Notes:</strong> ${note.Treatment_Notes}</p>` : ''}
                `;

                container.appendChild(card);
            }
        };
    }

    window.onload = function() {
        if (checkAuth()) {
            loadMedicalNotes();
        }
    };

    window.logout = logout;
</script>


</body>
</html>
