      <option selected>Select Location</option>

  <ul class="nav-right">

	<!-- LOGIN DROPDOWN -->

    <!-- login for patients -->
    <div id="appContainer">
        <div id="loginPage" class="page active">
            <div class="login-container">
                <div class="login-box">
                    <h2>Patient Login</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div class="form-group checkbox">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <label for="rememberMe">Remember me?</label>
                        </div>
                        <div class="form-links">
                            <a href="#" class="forgot-password">Forgot password?</a>
                        </div>
                        <!-- add this back in when we have js: <button type="submit" class="btn-primary">Login</button> -->
						<a href="portal.html" class="btn-primary" style="display:inline-block; text-align:center;">Login</a>
						<!-- above is temp patient-portal access -->
                    </form>
                    <p class="register-link">Don't have an account? <a href="#" id="registerLink">Register Now</a></p>
                </div>
            </div>
        </div>

  <!-- FOOTER -->
